name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A deploy that has already started is allowed to
# finish rather than being cancelled by the next push, which is what GitHub
# recommends for Pages — a half-cancelled deployment can leave the environment
# holding a lock that later runs queue behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content and media are committed to the repo, so the build never needs
      # the original WordPress sites to be reachable.
      - run: npm run build

      # If a deploy fails, use "Re-run failed jobs" rather than "Re-run all
      # jobs". Re-running all of them uploads a second artifact named
      # github-pages into the same run, and deploy-pages refuses to choose
      # between two. A fresh push is the other safe option.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
